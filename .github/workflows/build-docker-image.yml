name: Build and Push Docker Images

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-services:
    name: Detect Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      build-matrix: ${{ steps.detect.outputs.build-matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect services in apps/
        id: detect
        run: |
          # Find all directories in apps/ that have a Dockerfile
          services=()
          matrix_json='['
          
          for dir in apps/*/; do
            if [ -f "${dir}Dockerfile" ]; then
              service_name=$(basename "$dir")
              services+=("$service_name")
              
              # Build matrix JSON for docker build
              if [ ${#matrix_json} -gt 1 ]; then
                matrix_json+=','
              fi
              matrix_json+="{\"service\":\"$service_name\",\"context\":\"$dir\"}"
            fi
          done
          
          matrix_json+=']'
          
          # Output results
          echo "services=$(IFS=,; echo "${services[*]}")" >> $GITHUB_OUTPUT
          echo "build-matrix=$matrix_json" >> $GITHUB_OUTPUT
          
          echo "Detected services: ${services[*]}"
          echo "Build matrix: $matrix_json"

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: detect-services
    if: needs.detect-services.outputs.services != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-services.outputs.build-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        id: meta
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION_NO_V=${VERSION#v}
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:$VERSION_NO_V,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}-${{ matrix.service }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image digest
        run: |
          echo "✅ ${{ matrix.service }} image pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
