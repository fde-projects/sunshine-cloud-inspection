table:
  name: assessments
  schema: public
object_relationships:
  - name: updated_by
    using:
      foreign_key_constraint_on: updated_by_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: site_manager
    permission:
      check: {}
      columns:
        - correction_amount
        - correction_reason
        - created_at
        - event_penalty
        - id
        - internal_score
        - month
        - other_subsidy
        - rank_group
        - rank_result
        - reward_amount
        - score_detail
        - site_rank_result
        - subsidy_remark
        - sungrow_score
        - tool_subsidy
        - total_score
        - updated_at
        - updated_by_id
        - user_id
        - user_role
  - role: super_admin
    permission:
      check: {}
      columns:
        - correction_amount
        - correction_reason
        - created_at
        - event_penalty
        - id
        - internal_score
        - month
        - other_subsidy
