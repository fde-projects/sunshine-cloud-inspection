        - id
        - inspector_id
        - service_case_id
        - status
        - updated_at
      filter:
        service_case:
          site:
            _or:
              - manager_id:
                  _eq: X-Hasura-User-Id
              - site_members:
                  status:
                    _eq: active
                  user_id:
                    _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: super_admin
    permission:
      columns:
