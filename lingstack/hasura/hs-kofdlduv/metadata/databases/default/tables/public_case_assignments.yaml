table:
  name: case_assignments
  schema: public
object_relationships:
  - name: assign_by
    using:
      foreign_key_constraint_on: assign_by_id
  - name: inspector
    using:
      foreign_key_constraint_on: inspector_id
  - name: service_case
    using:
      foreign_key_constraint_on: service_case_id
insert_permissions:
  - role: inspector
    permission:
      check:
        inspector_id:
          _eq: X-Hasura-User-Id
      columns:
        - assign_by_id
        - assign_time
        - completed_units
        - created_at
        - id
        - inspector_id
        - service_case_id
        - status
        - updated_at
  - role: site_manager
    permission:
      check:
        service_case:
          site:
            _or:
              - manager_id:
                  _eq: X-Hasura-User-Id
              - site_members:
                  status:
                    _eq: active
                  user_id:
                    _eq: X-Hasura-User-Id
      columns:
        - assign_by_id
        - assign_time
        - completed_units
        - created_at
        - id
        - inspector_id
        - service_case_id
        - status
        - updated_at
  - role: super_admin
    permission:
      check: {}
      columns:
        - assign_by_id
        - assign_time
        - completed_units
        - created_at
        - id
        - inspector_id
        - service_case_id
        - status
        - updated_at
