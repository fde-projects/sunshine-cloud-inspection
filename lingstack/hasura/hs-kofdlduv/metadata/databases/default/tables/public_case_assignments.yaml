    permission:
      columns:
        - assign_by_id
        - assign_time
        - completed_units
        - created_at
        - id
        - inspector_id
        - service_case_id
        - status
        - updated_at
      filter:
        inspector_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
