        - gsp_case_no
        - id
        - inspector_id
        - month
        - perf_base
        - perf_final
        - review_comment
        - review_status
        - review_time
        - reviewer_id
        - service_case_id
        - updated_at
      filter:
        inspector_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: site_manager
    permission:
      columns:
        - case_revenue
        - created_at
        - deduct_by_id
        - deduction
        - deduction_reason
        - deduction_review_by_id
        - deduction_review_time
        - deduction_status
        - gsp_case_no
        - id
        - inspector_id
        - month
        - perf_base
