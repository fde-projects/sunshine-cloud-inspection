        - updated_at
      filter:
        service_case:
          site:
            _or:
              - manager_id:
                  _eq: X-Hasura-User-Id
              - site_members:
                  status:
                    _eq: active
                  user_id:
                    _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: super_admin
    permission:
      columns:
        - case_revenue
        - created_at
        - deduct_by_id
        - deduction
        - deduction_reason
        - deduction_review_by_id
        - deduction_review_time
