table:
  name: import_batches
  schema: public
object_relationships:
  - name: operator
    using:
      foreign_key_constraint_on: operator_id
array_relationships:
  - name: po_orders
    using:
      foreign_key_constraint_on:
        column: import_batch_id
        table:
          name: po_orders
          schema: public
  - name: service_cases
    using:
      foreign_key_constraint_on:
        column: import_batch_id
        table:
          name: service_cases
          schema: public
insert_permissions:
  - role: site_manager
    permission:
      check:
        operator_id:
          _eq: X-Hasura-User-Id
      columns:
        - created_at
        - fail_detail
        - fail_rows
        - file_name
        - id
        - import_type
        - operator_id
        - success_rows
        - total_rows
        - updated_at
  - role: super_admin
    permission:
      check: {}
      columns:
        - created_at
        - fail_detail
        - fail_rows
        - file_name
        - id
        - import_type
        - operator_id
        - success_rows
        - total_rows
        - updated_at
select_permissions:
  - role: site_manager
    permission:
      columns:
        - created_at
        - fail_detail
        - fail_rows
        - file_name
        - id
        - import_type
        - operator_id
        - success_rows
        - total_rows
        - updated_at
      filter:
        operator_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: super_admin
    permission:
      columns:
        - created_at
        - fail_detail
        - fail_rows
        - file_name
        - id
        - import_type
        - operator_id
        - success_rows
        - total_rows
        - updated_at
      filter: {}
      allow_aggregations: true
update_permissions:
  - role: site_manager
    permission:
      columns:
        - created_at
        - fail_detail
        - fail_rows
        - file_name
        - id
        - import_type
        - operator_id
        - success_rows
        - total_rows
        - updated_at
      filter:
        operator_id:
          _eq: X-Hasura-User-Id
      check:
        operator_id:
          _eq: X-Hasura-User-Id
  - role: super_admin
    permission:
      columns:
        - created_at
        - fail_detail
        - fail_rows
        - file_name
        - id
        - import_type
        - operator_id
        - success_rows
        - total_rows
        - updated_at
      filter: {}
      check: {}
delete_permissions:
  - role: site_manager
    permission:
      filter:
        operator_id:
          _eq: X-Hasura-User-Id
  - role: super_admin
    permission:
      filter: {}
