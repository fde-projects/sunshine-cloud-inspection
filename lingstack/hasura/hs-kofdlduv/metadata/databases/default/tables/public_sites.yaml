        - code
        - created_at
        - deleted_at
        - district
        - id
        - inspection_radius_meters
        - latitude
        - longitude
        - manager_id
        - name
        - province
        - status
  - role: super_admin
    permission:
      check: {}
      columns:
        - address
        - city
        - code
        - created_at
        - deleted_at
        - district
        - id
        - inspection_radius_meters
        - latitude
        - longitude
        - manager_id
        - name
        - province
        - status
