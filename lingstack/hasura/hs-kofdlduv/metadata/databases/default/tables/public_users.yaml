insert_permissions:
  - role: inspector
    permission:
      check:
        id:
          _eq: X-Hasura-User-Id
      columns:
        - avatar
        - created_at
        - created_by_id
        - email
        - employee_no
        - id
        - org_unit
        - phone
        - real_name
        - region
        - role
        - roles
        - status
        - updated_at
        - username
  - role: site_manager
    permission:
      check:
        _or:
          - id:
              _eq: X-Hasura-User-Id
          - created_by_id:
              _eq: X-Hasura-User-Id
          - site_members:
              site:
                _or:
                  - manager_id:
                      _eq: X-Hasura-User-Id
                  - site_members:
                      status:
                        _eq: active
                      user_id:
                        _eq: X-Hasura-User-Id
          - sites:
              _or:
                - manager_id:
                    _eq: X-Hasura-User-Id
                - site_members:
                    status:
                      _eq: active
                    user_id:
                      _eq: X-Hasura-User-Id
      columns:
        - id
        - username
        - real_name
        - employee_no
        - phone
        - email
        - avatar
        - role
        - roles
        - status
        - region
        - org_unit
        - created_by_id
        - created_at
        - updated_at
        - password
  - role: super_admin
    permission:
      check: {}
      columns:
        - id
        - username
        - real_name
        - employee_no
        - phone
        - email
        - avatar
        - role
        - roles
        - status
        - region
        - org_unit
        - created_by_id
        - created_at
        - updated_at
        - password
