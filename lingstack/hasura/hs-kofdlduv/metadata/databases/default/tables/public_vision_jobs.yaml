table:
  name: vision_jobs
  schema: public
object_relationships:
  - name: inspection_record
    using:
      foreign_key_constraint_on: inspection_record_id
insert_permissions:
  - role: inspector
    permission:
      check:
        inspection_record:
          task:
            inspector_id:
              _eq: X-Hasura-User-Id
      columns:
        - attempts
        - created_at
        - error_message
        - id
        - inspection_record_id
        - result
        - status
        - template_entry_id
        - updated_at
  - role: site_manager
    permission:
      check:
        inspection_record:
          task:
            site:
              _or:
                - manager_id:
                    _eq: X-Hasura-User-Id
                - site_members:
                    status:
                      _eq: active
                    user_id:
                      _eq: X-Hasura-User-Id
      columns:
        - attempts
        - created_at
        - error_message
        - id
        - inspection_record_id
        - result
        - status
        - template_entry_id
        - updated_at
  - role: super_admin
    permission:
      check: {}
      columns:
        - attempts
        - created_at
        - error_message
        - id
        - inspection_record_id
        - result
        - status
        - template_entry_id
        - updated_at
